<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chronology Browser</title>
<style>
  :root{
    --bg:#fbfbfa;--fg:#1a1a1a;--muted:#6b7280;--card:#ffffff;--border:#e4e4e7;
    --accent:#2563eb;--sidebar:#f4f4f3;--quote-bar:#cbd5e1;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#16171a;--fg:#e6e6e6;--muted:#9aa0a6;--card:#1f2023;--border:#33353a;
      --accent:#6ea8fe;--sidebar:#1b1c1f;--quote-bar:#44474d;}
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    display:grid;grid-template-columns:290px 1fr;grid-template-rows:100vh}
  aside{background:var(--sidebar);border-right:1px solid var(--border);
    display:flex;flex-direction:column;overflow:hidden}
  aside header{padding:16px 16px 10px;border-bottom:1px solid var(--border)}
  aside h1{font-size:1rem;margin:0 0 8px}
  #search{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;
    background:var(--card);color:var(--fg);font:inherit;font-size:.86rem}
  #nav{padding:8px 8px 0;display:flex;flex-direction:column;gap:5px}
  #nav .navbtn{width:100%;text-align:left;padding:9px 11px;border-radius:8px;font-size:.88rem;
    font-weight:600;border:1px solid var(--border);background:var(--card)}
  #nav .navbtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  #list{list-style:none;margin:0;padding:8px;overflow-y:auto;flex:1}
  #list li{padding:9px 11px;border-radius:8px;cursor:pointer;margin-bottom:3px}
  #list li:hover{background:var(--card)}
  #list li.active{background:var(--accent);color:#fff}
  #list li.active .meta{color:rgba(255,255,255,.85)}
  #list .t{font-size:.88rem;font-weight:600;display:block;line-height:1.3}
  #list .meta{font-size:.74rem;color:var(--muted);margin-top:2px}
  main{overflow:hidden;position:relative;display:flex;flex-direction:column}
  .toolbar{flex:none;display:flex;gap:8px;align-items:center;
    padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--border)}
  .toolbar[hidden]{display:none}
  .toolbar .spacer{flex:1}
  button{font:inherit;font-size:.82rem;padding:6px 12px;border:1px solid var(--border);
    background:var(--card);color:var(--fg);border-radius:8px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  #reanalyze-bar{display:none;gap:10px;align-items:center;padding:8px 16px;
    background:var(--sidebar);border-bottom:1px solid var(--border);
    font-size:.8rem;color:var(--muted)}
  #reanalyze-bar.show{display:flex}
  #reanalyze-bar.ra-ok{color:#16a34a}
  #reanalyze-bar.ra-fail{color:#b91c1c}
  #reanalyze-bar #ra-text{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  #reanalyze-bar .spin{flex:none;width:12px;height:12px;border-radius:50%;
    border:2px solid var(--border);border-top-color:var(--accent);animation:ra-spin .8s linear infinite}
  #reanalyze-bar.ra-ok .spin,#reanalyze-bar.ra-fail .spin{animation:none;border-top-color:currentColor;opacity:.5}
  @keyframes ra-spin{to{transform:rotate(360deg)}}
  .content{flex:1;overflow:auto;position:relative}
  .content.framed{display:flex;flex-direction:column;overflow:hidden}
  .content.framed>#frame{flex:1 1 auto;height:auto}
  .claimlist-bar{flex:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:9px 16px;border-bottom:1px solid var(--border);background:var(--sidebar);font-size:.85rem}
  .claimlist-bar .sub{color:var(--muted);margin:0}
  .claimlist-bar .cl-origin{font-size:.82rem;color:var(--muted)}
  #frame{width:100%;height:100%;border:0;display:block;background:var(--bg)}
  .empty{color:var(--muted);padding:60px 24px;text-align:center}
  pre.raw{max-width:920px;margin:0 auto;padding:20px;white-space:pre-wrap;word-break:break-word;
    font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}

  /* statistics panel */
  .stats{max-width:900px;margin:0 auto;padding:28px 22px 80px}
  .stats h1{font-size:1.5rem;margin:0 0 4px}
  .stats .sub{color:var(--muted);font-size:.85rem;margin-bottom:22px}
  .stats h2{font-size:1rem;margin:26px 0 10px}
  .cards{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:8px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:14px 18px;min-width:130px;display:flex;flex-direction:column;gap:2px}
  .card .big{font-size:1.9rem;font-weight:700;line-height:1}
  .card .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .sbar{display:flex;height:22px;border-radius:6px;overflow:hidden;border:1px solid var(--border);margin-bottom:12px}
  .sbar span{display:block}
  .sbar span:not(:last-child){border-right:1px solid var(--bg)}
  table.brk{border-collapse:collapse;width:100%;font-size:.9rem}
  table.brk td,table.brk th{padding:6px 10px;border-bottom:1px solid var(--border);text-align:left}
  table.brk th{color:var(--muted);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.03em}
  table.brk td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:middle}
  .s-retrieved,.s-resolved{background:#16a34a}.s-pending{background:#d97706}.s-dead_end{background:#dc2626}
  .s-no_source,.s-unknown,.s-unspecified{background:#9ca3af}.s-other{background:#7c3aed}
  .minibar{display:inline-flex;width:120px;height:10px;border-radius:3px;overflow:hidden;
    border:1px solid var(--border);vertical-align:middle}
  .minibar span{display:block;height:100%}
  .badge{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;
    text-transform:lowercase;letter-spacing:.02em;border:1px solid transparent;white-space:nowrap}
  .badge-ok{background:#dcfce7;color:#166534}.badge-warn{background:#fef3c7;color:#92400e}
  .badge-bad{background:#fee2e2;color:#991b1b}.badge-term{background:#ede9fe;color:#5b21b6}
  .badge-neutral{background:#e5e7eb;color:#374151}
  @media (prefers-color-scheme:dark){
    .badge-ok{background:#14532d;color:#bbf7d0}.badge-warn{background:#78350f;color:#fde68a}
    .badge-bad{background:#7f1d1d;color:#fecaca}.badge-term{background:#4c1d95;color:#ddd6fe}
    .badge-neutral{background:#374151;color:#e5e7eb}
  }

  /* sources page */
  .sources{max-width:900px;margin:0 auto;padding:28px 22px 80px}
  .sources h1{font-size:1.5rem;margin:0 0 4px}
  .sources .sub{color:var(--muted);font-size:.85rem;margin-bottom:14px}
  .sources h2{font-size:1rem;margin:28px 0 4px}
  .src-list{list-style:none;margin:0;padding:0}
  .src-card{background:var(--card);border:1px solid var(--border);border-radius:10px;
    padding:12px 14px;margin-bottom:10px}
  .src-title{font-weight:600;font-size:.95rem}
  .src-bits{color:var(--muted);font-size:.82rem;margin-top:2px}
  .src-status-row{margin-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .src-note{font-style:italic;color:var(--muted);font-size:.82rem}
  .src-refs-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
    font-weight:700;margin-top:10px}
  .src-refs{margin-top:4px;display:flex;flex-wrap:wrap;gap:6px}
  .src-ref{font-size:.8rem;padding:2px 8px;border:1px solid var(--border);border-radius:6px;
    text-decoration:none;color:var(--accent);background:var(--bg)}
  .src-ref:hover{border-color:var(--accent)}
  .src-doc-title{font-weight:600;font-size:.95rem;color:var(--accent);text-decoration:none}
  .src-doc-title:hover{text-decoration:underline}
  table.kv2{border-collapse:collapse;width:100%;font-size:.86rem;margin:10px 0}
  table.kv2 th{text-align:left;vertical-align:top;padding:4px 14px 4px 0;color:var(--muted);
    font-weight:600;white-space:nowrap;width:1%}
  table.kv2 td{vertical-align:top;padding:4px 0;word-break:break-word}
  table.kv2 a{color:var(--accent);word-break:break-all}
  .rh-list{list-style:none;margin:6px 0 0;padding:0;font-size:.82rem}
  .rh-list>li{margin:0 0 8px}
  .rh-n{color:var(--muted);margin-right:4px}
  .rh-via{font-weight:600;margin-right:6px}
  .rh-url{margin:2px 0 0 18px;word-break:break-all;font-family:ui-monospace,Menlo,monospace;font-size:.78rem}
  .rh-url a{color:var(--muted)}
  .rh-detail{margin:2px 0 0 18px;color:var(--muted);font-style:italic}
  a.status-link{color:var(--accent);text-decoration:none}
  a.status-link:hover{text-decoration:underline}

  /* home / add article */
  .home{max-width:760px;margin:0 auto;padding:48px 22px 80px}
  .home h1{font-size:1.6rem;margin:0 0 6px}
  .home .sub{color:var(--muted);font-size:.9rem;margin-bottom:20px}
  #home-form{display:flex;gap:8px}
  #home-url{flex:1;padding:11px 14px;border:1px solid var(--border);border-radius:8px;
    background:var(--card);color:var(--fg);font:inherit;font-size:.95rem}
  #home-form button{padding:11px 20px;font-weight:600}
  .home-status{margin-top:16px;font-size:.85rem;color:var(--muted);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
  .home-status.home-ok{color:#16a34a}
  .home-status.home-fail{color:#b91c1c}

  /* claim finder */
  .finder{max-width:900px;margin:0 auto;padding:28px 22px 80px}
  .finder h1{font-size:1.5rem;margin:0 0 4px}
  .finder .sub{color:var(--muted);font-size:.85rem;margin-bottom:18px}
  #finder-form{display:flex;gap:8px;margin-bottom:8px}
  #finder-url{flex:1;padding:9px 12px;border:1px solid var(--border);border-radius:8px;
    background:var(--card);color:var(--fg);font:inherit;font-size:.9rem}
  #finder-form button{padding:9px 18px}
  #finder-out{margin-top:22px}
  .fr-head{font-size:.85rem;color:var(--muted)}
  .fr-counts{margin:6px 0 20px;font-size:.95rem}
  .fr-counts b{font-size:1.1rem}
  .fr-claims{list-style:none;margin:0;padding:0}
  .fr-claims li{background:var(--card);border:1px solid var(--border);border-radius:10px;
    padding:12px 14px;margin-bottom:10px}
  .fr-claims li.rejected{background:rgba(220,38,38,.09);border-color:rgba(220,38,38,.42)}
  .fr-sec{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:4px}
  .fr-drop{color:#b91c1c;font-weight:700;text-transform:none;letter-spacing:0;margin-left:6px}
  .fr-sent{font-size:.95rem;line-height:1.55}
  .fr-sent .ctx{color:var(--muted)}
  .fr-sent .hit{color:var(--fg);font-weight:500}
  .fr-sent mark.trg{background:rgba(250,204,21,.38);color:inherit;font-weight:700;border-radius:2px;padding:0 1px}
  .fr-sent sup{color:var(--accent);font-size:.7em;font-weight:600}
  .fr-cut{margin-top:6px;font-size:.78rem;color:var(--muted)}
  .fr-marks{margin-top:8px;font-size:.82rem;border-top:1px dashed var(--border);padding-top:7px}
  .fr-marks .m{margin:3px 0}
  .fr-marks .lab{font-family:ui-monospace,Menlo,monospace;color:var(--muted);margin-right:6px}
  .fr-marks .src{color:var(--muted)}
  .fr-err{color:#b91c1c;font-weight:600;padding:12px 0}
  @media (max-width:720px){
    body{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    aside{max-height:42vh}
  }
</style>
</head>
<body>
<aside>
  <header>
    <h1>Chronology Browser</h1>
    <input id="search" type="search" placeholder="Filter articles…" autocomplete="off">
  </header>
  <div id="nav">
    <button id="btn-home" class="navbtn" type="button">🏠&nbsp; Home</button>
    <button id="btn-stats" class="navbtn" type="button">📊&nbsp; Statistics</button>
    <button id="btn-finder" class="navbtn" type="button">🔎&nbsp; Claim finder</button>
    <button id="btn-sources" class="navbtn" type="button">📚&nbsp; Document sources</button>
    <button id="btn-unreachable" class="navbtn" type="button">🚫&nbsp; Unreachable sources</button>
    <button id="btn-radiocarbon" class="navbtn" type="button">☢️&nbsp; Radiocarbon sources</button>
  </div>
  <ul id="list"></ul>
</aside>
<main>
  <div class="toolbar" id="toolbar">
    <button id="btn-rendered" class="on">Rendered</button>
    <button id="btn-raw">Raw JSON</button>
    <span class="spacer"></span>
    <button id="btn-reanalyze" title="Rerun the full extraction pipeline for this article">🔄&nbsp; Re-analyze</button>
    <button id="btn-download">Download HTML</button>
    <a id="dl" hidden></a>
  </div>
  <div id="reanalyze-bar"><span class="spin"></span><span id="ra-text"></span></div>
  <div class="content" id="content">
    <div class="empty">Select a Wikipedia article from the list, or open Statistics.</div>
  </div>
</main>

<script src="/render.js"></script>
<script>
(function () {
  var listEl = document.getElementById("list");
  var searchEl = document.getElementById("search");
  var contentEl = document.getElementById("content");
  var toolbarEl = document.getElementById("toolbar");
  var btnHome = document.getElementById("btn-home");
  var btnStats = document.getElementById("btn-stats");
  var btnFinder = document.getElementById("btn-finder");
  var btnSources = document.getElementById("btn-sources");
  var btnUnreachable = document.getElementById("btn-unreachable");
  var btnRadiocarbon = document.getElementById("btn-radiocarbon");
  var btnRendered = document.getElementById("btn-rendered");
  var btnRaw = document.getElementById("btn-raw");
  var btnDownload = document.getElementById("btn-download");
  var btnReanalyze = document.getElementById("btn-reanalyze");
  var reanalyzeBar = document.getElementById("reanalyze-bar");
  var raText = document.getElementById("ra-text");
  var dl = document.getElementById("dl");

  var files = [];
  var current = null;      // { meta, data }
  var view = "rendered";   // doc sub-view: rendered | raw
  var screen = "doc";      // doc | home | stats | finder | sources | unreachable | radiocarbon
  var finderState = { url: "", html: "" };   // survives switching away
  var suppressHash = false; // guard: hash we set ourselves shouldn't re-route
  var reanalyzePoll = null; // setInterval handle for the currently-open doc
  var sourcesCache = null;  // last /api/sources response, shared by both source tabs
  var claimsCache = null;   // last /api/claims response (claims grouped by status)
  var srcDocsCache = null;  // last /api/source-documents response
  var analyzePoll = null;   // setInterval handle for an in-flight "add article" run
  var homeState = { url: "" };

  var STATUS_LABELS = { retrieved: "retrieved", dead_end: "dead end", no_source: "no source", resolved: "resolved", pending: "pending" };
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function statusClass(k) {
    return "s-" + (["retrieved", "dead_end", "no_source", "resolved", "pending"].indexOf(k) !== -1 ? k : "other");
  }
  function badge(text, kind) {
    return '<span class="badge badge-' + esc(kind || "neutral") + '">' + esc(text) + "</span>";
  }

  // where a retrieved source document was obtained from (mirrors serve.js)
  function documentSourceOf(s) {
    if (!s || s.retrieval_status !== "retrieved") return null;
    if (s.retrieved_via_wayback) return "Wayback Machine";
    var hit = (s.retrieval_history || []).filter(function (e) { return e && e.result === "retrieved"; })[0];
    var via = hit ? String(hit.via || "") : "";
    if (/wayback/i.test(via)) return "Wayback Machine";
    if (/internet archive/i.test(via)) return "Internet Archive";
    if (/google books/i.test(via)) return "Google Books";
    if (/ncbi bioc/i.test(via)) return "NCBI BioC";
    if (/europepmc/i.test(via)) return "Europe PMC";
    if (/openalex/i.test(via)) return "OpenAlex";
    if (/unpaywall/i.test(via)) return "Unpaywall";
    if (/wikipedia archive/i.test(via)) return "Wikipedia archive link";
    if (/doi landing/i.test(via)) return "DOI resolver";
    if (/direct pdf/i.test(via)) return "Direct PDF link";
    if (/cited url/i.test(via)) return "Publisher / web page";
    return via || "cache";
  }

  function fetchJSON(url) {
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error(r.status + " " + r.statusText);
      return r.json();
    });
  }

  function renderList() {
    var q = searchEl.value.trim().toLowerCase();
    listEl.innerHTML = "";
    files
      .filter(function (f) {
        return !q || (f.title + " " + f.name).toLowerCase().indexOf(q) !== -1;
      })
      .forEach(function (f) {
        var li = document.createElement("li");
        li.innerHTML =
          '<span class="t"></span><span class="meta"></span>';
        li.querySelector(".t").textContent = f.title;
        li.querySelector(".meta").textContent =
          f.kind === "page"
            ? "article · " + f.count + " claim" + (f.count === 1 ? "" : "s")
            : f.kind + " · " + f.count + " entries";
        if (screen === "doc" && current && current.meta.id === f.id) li.className = "active";
        li.onclick = function () { load(f); };
        listEl.appendChild(li);
      });
  }

  function renderStats(s) {
    var order = Object.keys(s.by_status);
    var bar = order
      .map(function (k) {
        var p = s.by_status[k].pct;
        return '<span class="' + statusClass(k) + '" style="width:' + p + '%" title="' +
          esc(k) + " " + p + '%"></span>';
      })
      .join("");
    var rows = order
      .map(function (k) {
        var label = esc(STATUS_LABELS[k] || k.replace(/_/g, " "));
        return "<tr><td><span class=\"dot " + statusClass(k) + '"></span>' +
          '<a href="#claims/' + esc(k) + '" class="status-link">' + label + "</a></td>" +
          '<td class="num">' + s.by_status[k].count + "</td>" +
          '<td class="num">' + s.by_status[k].pct.toFixed(1) + "%</td></tr>";
      })
      .join("");

    var modeRows = Object.keys(s.by_mode)
      .map(function (m) {
        var v = s.by_mode[m];
        return "<tr><td>" + esc(m) + "</td><td class=\"num\">" + v.documents +
          "</td><td class=\"num\">" + v.claims + "</td></tr>";
      })
      .join("") || '<tr><td colspan="3" style="color:var(--muted)">no Wikipedia articles</td></tr>';

    var docRows = s.per_document
      .map(function (d) {
        var mini = Object.keys(d.by_status)
          .map(function (k) {
            var p = d.claims ? (100 * d.by_status[k]) / d.claims : 0;
            return '<span class="' + statusClass(k) + '" style="width:' + p + '%"></span>';
          })
          .join("");
        return "<tr><td>" + esc(d.title) + '</td><td>' + esc(d.mode) +
          '</td><td class="num">' + d.claims + "</td>" +
          '<td><span class="minibar">' + mini + "</span></td></tr>";
      })
      .join("");

    return (
      '<div class="stats">' +
      "<h1>Statistics</h1>" +
      '<div class="sub">across all Wikipedia articles in this source</div>' +
      '<div class="cards">' +
      '<div class="card"><span class="big">' + s.claims + '</span><span class="lbl">claims found</span></div>' +
      '<div class="card"><span class="big">' + s.documents + '</span><span class="lbl">Wikipedia articles</span></div>' +
      "</div>" +
      "<h2>Claims by status</h2>" +
      (s.claims ? '<div class="sbar">' + bar + "</div>" : "") +
      '<table class="brk"><tr><th>status</th><th class="num">count</th><th class="num">share</th></tr>' +
      (rows || '<tr><td colspan="3" style="color:var(--muted)">no claims</td></tr>') +
      "</table>" +
      "<h2>By generation mode</h2>" +
      '<table class="brk"><tr><th>mode</th><th class="num">articles</th><th class="num">claims</th></tr>' +
      modeRows + "</table>" +
      "<h2>Per article</h2>" +
      '<table class="brk"><tr><th>article</th><th>mode</th><th class="num">claims</th><th>status mix</th></tr>' +
      docRows + "</table>" +
      "</div>"
    );
  }

  function setNav(active) {
    screen = active;
    current = null;
    contentEl.className = "content";
    toolbarEl.hidden = active !== "doc";
    stopReanalyzePoll();
    hideReanalyzeBar();
    btnHome.classList.toggle("active", active === "home");
    btnStats.classList.toggle("active", active === "stats");
    btnFinder.classList.toggle("active", active === "finder");
    btnSources.classList.toggle("active", active === "sources");
    btnUnreachable.classList.toggle("active", active === "unreachable");
    btnRadiocarbon.classList.toggle("active", active === "radiocarbon");
    renderList();
  }

  function showStats() {
    setNav("stats");
    setHash("#stats");
    document.title = "Statistics — Chronology Browser";
    contentEl.innerHTML = '<div class="empty">Loading statistics…</div>';
    fetchJSON("/api/stats")
      .then(function (s) { contentEl.innerHTML = renderStats(s); })
      .catch(function (e) {
        contentEl.innerHTML = '<div class="empty">Failed to load statistics: ' + esc(e.message) + "</div>";
      });
  }

  // every claim of one status across the corpus — reached by clicking a row on
  // the statistics page (#claims/<status>). Each claim is rendered with the
  // same ChronoRender template as the document page (in an iframe), so it shows
  // its citations and citation chain; click a claim to open it in its report.
  var claimDocMap = {}; // claim_id -> doc_id, for the click-through
  function showClaimList(status) {
    setNav("stats");
    setHash("#claims/" + encodeURIComponent(status));
    var label = STATUS_LABELS[status] || status.replace(/_/g, " ");
    document.title = label + " claims — Chronology Browser";
    contentEl.innerHTML = '<div class="empty">Loading claims…</div>';
    var render = function (groups) {
      var entries = (groups[status] || []).slice();
      entries.sort(function (a, b) {
        return a.doc_title.localeCompare(b.doc_title) ||
          String(a.claim.claim_id).localeCompare(String(b.claim.claim_id));
      });
      claimDocMap = {};
      var claims = entries.map(function (e) {
        claimDocMap[e.claim.claim_id] = e.doc_id;
        // prefix the section with the document title so each rendered claim
        // still says where it came from
        var loc = e.claim.location_on_page;
        return Object.assign({}, e.claim, {
          location_on_page: e.doc_title + (loc ? " · " + loc : ""),
        });
      });
      contentEl.className = "content framed";
      contentEl.innerHTML =
        '<div class="claimlist-bar">' +
        '<a href="#" class="status-link" id="back-stats">&larr; statistics</a>' +
        '<span class="dot ' + statusClass(status) + '"></span>' +
        "<b>" + esc(label) + " claims (" + claims.length + ")</b>" +
        '<span class="sub">each claim links back to its report</span></div>';
      var frame = document.createElement("iframe");
      frame.id = "frame";
      contentEl.appendChild(frame);
      var synth = { schema_version: "1.0", page: { title: label + " claims" }, claims: claims };
      // give each rendered claim an explicit "open in report" link — a plain
      // whole-claim click handler would swallow text selection (copying an
      // ISBN, a quote, …)
      var inject =
        "<style>.claim-open{margin-left:auto;font-size:.72rem;padding:2px 9px;" +
        "border:1px solid var(--border);border-radius:6px;color:var(--accent);cursor:pointer;" +
        "background:var(--card);font-weight:400;white-space:nowrap}" +
        ".claim-open:hover{border-color:var(--accent)}</style>" +
        "<script>(function(){var a=document.querySelectorAll('article.claim');" +
        "for(var i=0;i<a.length;i++){(function(art){if(!art.id)return;" +
        "var h=art.querySelector('.claim-head');if(!h)return;" +
        "var b=document.createElement('span');b.className='claim-open';" +
        "b.textContent='open in report \\u2197';" +
        "b.addEventListener('click',function(e){e.stopPropagation();" +
        "parent.postMessage({timeauditOpenClaim:art.id},'*');});" +
        "h.appendChild(b);})(a[i]);}})();<\/script>";
      frame.srcdoc = ChronoRender.renderDocument(synth, {}).replace("</body>", inject + "</body>");
      var back = document.getElementById("back-stats");
      if (back) back.onclick = function (e) { e.preventDefault(); showStats(); };
    };
    if (claimsCache) return render(claimsCache);
    fetchJSON("/api/claims")
      .then(function (g) { claimsCache = g; render(g); })
      .catch(function (e) {
        contentEl.className = "content";
        contentEl.innerHTML = '<div class="empty">Failed to load claims: ' + esc(e.message) + "</div>";
      });
  }

  // a claim clicked inside the status-list iframe -> open it in its report
  window.addEventListener("message", function (ev) {
    var d = ev.data;
    if (!d || !d.timeauditOpenClaim) return;
    var docId = claimDocMap[d.timeauditOpenClaim];
    var meta = files.filter(function (f) { return f.id === docId; })[0];
    if (meta) load(meta, d.timeauditOpenClaim);
  });

  // one claim on its own shareable page (#claim/<articleId>/<claimId>) —
  // rendered with the full document template, plus its surrounding context
  function showClaim(docId, claimId) {
    setNav("claim");
    setHash("#claim/" + encodeURIComponent(docId) + "/" + encodeURIComponent(claimId));
    var meta = files.filter(function (f) { return f.id === docId; })[0];
    document.title = claimId + (meta ? " · " + meta.title : "") + " — Chronology Browser";
    contentEl.innerHTML = '<div class="empty">Loading claim…</div>';
    Promise.all([
      fetchJSON("/api/file?id=" + encodeURIComponent(docId)),
      fetchJSON("/api/context?id=" + encodeURIComponent(docId)).catch(function () { return {}; }),
    ])
      .then(function (r) {
        var data = r[0], ctx = r[1] || {};
        var claim = (data.claims || []).filter(function (c) { return c.claim_id === claimId; })[0];
        var artTitle = (data.page && data.page.title) || (meta && meta.title) || docId;
        if (!claim) {
          contentEl.className = "content";
          contentEl.innerHTML =
            '<div class="sources"><h1>' + esc(claimId) + "</h1>" +
            '<div class="empty">No claim ' + esc(claimId) + " in " + esc(artTitle) + ".</div></div>";
          return;
        }
        // the document source(s) this claim's retrieved source document(s) came from
        var origins = [];
        (claim.citation_chain || []).forEach(function (h) {
          var o = documentSourceOf(h.source || {});
          if (o && origins.indexOf(o) === -1) origins.push(o);
        });
        var originHtml = origins.length
          ? " <span class=\"cl-origin\">document source: " +
            origins
              .map(function (o) {
                return '<a href="#docsource/' + encodeURIComponent(o) + '" class="status-link">' + esc(o) + "</a>";
              })
              .join(", ") +
            "</span>"
          : "";

        contentEl.className = "content framed";
        contentEl.innerHTML =
          '<div class="claimlist-bar">' +
          '<a href="#doc/' + encodeURIComponent(docId) + '" class="status-link" id="back-art">&larr; ' + esc(artTitle) + "</a>" +
          "<b>" + esc(claimId) + "</b>" +
          originHtml +
          '<span class="sub">this page’s URL links straight to this claim</span></div>';
        var frame = document.createElement("iframe");
        frame.id = "frame";
        contentEl.appendChild(frame);
        var synth = {
          schema_version: data.schema_version,
          generator: data.generator,
          page: { title: artTitle + " · " + claimId, url: data.page && data.page.url },
          claims: [claim],
        };
        var sctx = {};
        if (ctx && ctx[claimId]) sctx[claimId] = ctx[claimId];
        frame.srcdoc = ChronoRender.renderDocument(synth, { context: sctx, hideSummary: true });
        var back = document.getElementById("back-art");
        if (back && meta) back.onclick = function (e) { e.preventDefault(); load(meta, claimId); };
      })
      .catch(function (e) {
        contentEl.className = "content";
        contentEl.innerHTML = '<div class="empty">Failed to load claim: ' + esc(e.message) + "</div>";
      });
  }

  /* ---- sources: unreachable / validated, across the whole corpus ------ */

  function srcRefs(refs) {
    return (
      '<div class="src-refs">' +
      refs
        .map(function (r) {
          return (
            '<a href="#" class="src-ref" data-doc="' + esc(r.doc_id) + '" data-claim="' + esc(r.claim_id) + '">' +
            esc(r.doc_title) + " · " + esc(r.claim_id) +
            "</a>"
          );
        })
        .join("") +
      "</div>"
    );
  }

  function sourceCard(entry, kind) {
    var s = entry.source || {};
    var author = Array.isArray(s.author) ? s.author.join(", ") : s.author;
    // an ISBN (or other identifier) is the practical way to chase down a book
    // that has no working online copy — surface it on the card
    var bits = [author, s.year, s.document_type, s.identifier].filter(Boolean).join(" · ");
    var badgeHtml =
      kind === "validated"
        ? badge((entry.terminal_type || "terminal").replace(/_/g, " "), "term")
        : badge("unreachable", "bad");
    return (
      '<li class="src-card">' +
      '<div class="src-title">' + esc(s.title || "(untitled source)") + "</div>" +
      (bits ? '<div class="src-bits">' + esc(bits) + "</div>" : "") +
      '<div class="src-status-row">' + badgeHtml +
      (s.retrieved_via_wayback === true ? " " + badge("via Wayback Machine", "neutral") : "") +
      (kind === "unreachable" && s.retrieval_note ? ' <span class="src-note">' + esc(s.retrieval_note) + "</span>" : "") +
      "</div>" +
      '<div class="src-refs-label">cited by</div>' +
      srcRefs(entry.refs) +
      "</li>"
    );
  }

  function renderSourceList(title, sub, list, kind) {
    return (
      '<div class="sources">' +
      "<h1>" + esc(title) + " (" + list.length + ")</h1>" +
      '<div class="sub">' + esc(sub) + "</div>" +
      (list.length
        ? '<ul class="src-list">' + list.map(function (e) { return sourceCard(e, kind); }).join("") + "</ul>"
        : '<div class="empty">None.</div>')
    );
  }

  function wireSourceRefs() {
    var links = contentEl.querySelectorAll("a.src-ref");
    for (var i = 0; i < links.length; i++) {
      links[i].onclick = function (e) {
        e.preventDefault();
        var docId = this.getAttribute("data-doc");
        var claimId = this.getAttribute("data-claim");
        var meta = files.filter(function (f) { return f.id === docId; })[0];
        if (meta) load(meta, claimId);
      };
    }
  }

  // both source tabs share one /api/sources fetch, cached for the session
  function withSources(cb) {
    if (sourcesCache) return cb(sourcesCache);
    contentEl.innerHTML = '<div class="empty">Loading sources…</div>';
    fetchJSON("/api/sources")
      .then(function (d) { sourcesCache = d; cb(d); })
      .catch(function (e) {
        contentEl.innerHTML = '<div class="empty">Failed to load sources: ' + esc(e.message) + "</div>";
      });
  }

  function showUnreachable() {
    setNav("unreachable");
    setHash("#unreachable");
    document.title = "Unreachable sources — Chronology Browser";
    withSources(function (d) {
      contentEl.innerHTML = renderSourceList(
        "Unreachable source documents",
        "source documents a Wikipedia article cites whose full text could not be retrieved online — each with the specific reason",
        d.unreachable || [],
        "unreachable"
      );
      wireSourceRefs();
    });
  }

  function showRadiocarbon() {
    setNav("radiocarbon");
    setHash("#radiocarbon");
    document.title = "Radiocarbon sources — Chronology Browser";
    withSources(function (d) {
      var rc = (d.validated || []).filter(function (e) { return e.terminal_type === "radiocarbon"; });
      contentEl.innerHTML = renderSourceList(
        "Radiocarbon source documents",
        "source documents whose text carries the radiocarbon date behind a claim — populated by phase 3 (reading the downloaded source documents), which is not implemented yet",
        rc,
        "validated"
      );
      wireSourceRefs();
    });
  }

  /* ---- document sources: browse source documents by where they came from --- */

  function withSourceDocs(cb) {
    if (srcDocsCache) return cb(srcDocsCache);
    contentEl.innerHTML = '<div class="empty">Loading source documents…</div>';
    fetchJSON("/api/source-documents")
      .then(function (d) { srcDocsCache = d; cb(d); })
      .catch(function (e) {
        contentEl.innerHTML = '<div class="empty">Failed to load source documents: ' + esc(e.message) + "</div>";
      });
  }

  function srcDocRow(rec) {
    var s = rec.source || {};
    var author = Array.isArray(s.author) ? s.author.join(", ") : s.author;
    var bits = [author, s.year, s.document_type, s.identifier].filter(Boolean).join(" · ");
    var kind = rec.status === "retrieved" ? "ok" : rec.status === "unreachable" ? "bad" : "neutral";
    return (
      '<li class="src-card">' +
      '<a href="#source/' + encodeURIComponent(rec.key) + '" class="src-doc-title">' +
      esc(s.title || "(untitled source document)") + "</a>" +
      (bits ? '<div class="src-bits">' + esc(bits) + "</div>" : "") +
      '<div class="src-status-row">' + badge(String(rec.status).replace(/_/g, " "), kind) +
      (rec.origin ? " " + badge(rec.origin, "neutral") : "") +
      '<span class="src-note">cited by ' + rec.refs.length + " claim" + (rec.refs.length === 1 ? "" : "s") + "</span></div>" +
      "</li>"
    );
  }

  // `only` (optional): show just that one document source's documents
  function showDocumentSources(only) {
    setNav("sources");
    setHash(only ? "#docsource/" + encodeURIComponent(only) : "#sources");
    document.title = (only ? only + " — " : "") + "Document sources — Chronology Browser";
    withSourceDocs(function (recs) {
      var groups = {};
      recs.forEach(function (r) {
        var g = r.origin || "not retrieved";
        (groups[g] = groups[g] || []).push(r);
      });
      var names = Object.keys(groups).sort(function (a, b) {
        if (a === "not retrieved") return 1;
        if (b === "not retrieved") return -1;
        return a.localeCompare(b);
      });
      if (only) names = names.filter(function (g) { return g === only; });
      contentEl.innerHTML =
        '<div class="sources">' +
        (only
          ? '<div class="sub"><a href="#sources" class="status-link">&larr; all document sources</a></div><h1>' + esc(only) + "</h1>" +
            '<div class="sub">every source document obtained from ' + esc(only) + "</div>"
          : "<h1>Document sources</h1>" +
            '<div class="sub">every source document a Wikipedia article cites, grouped by where it was obtained</div>') +
        (names.length
          ? names
              .map(function (g) {
                var rows = groups[g].slice().sort(function (a, b) {
                  return (a.source.title || "").localeCompare(b.source.title || "");
                });
                return (
                  (only ? "" : '<h2>' + esc(g) + " <span class=\"sub\" style=\"font-weight:400\">(" + rows.length + ")</span></h2>") +
                  '<ul class="src-list">' + rows.map(srcDocRow).join("") + "</ul>"
                );
              })
              .join("")
          : '<div class="empty">No source documents from ' + esc(only || "") + ".</div>") +
        "</div>";
    });
  }

  function histBlock(title, hist, isMeta) {
    if (!Array.isArray(hist) || !hist.length) return "";
    var rows = hist
      .map(function (h, i) {
        var kind = /^retrieved$|^enriched$/.test(h.result) ? "ok" : /^skipped$|budget/.test(h.result || "") ? "neutral" : "bad";
        var extra = "";
        if (isMeta && h.found) {
          var f = h.found, parts = [];
          if (f.title) parts.push("title: " + f.title);
          if (f.author && f.author.length) parts.push("author: " + (Array.isArray(f.author) ? f.author.join(", ") : f.author));
          if (f.year) parts.push("year: " + f.year);
          if (f.container) parts.push("in: " + f.container);
          if (f.doi) parts.push("DOI: " + f.doi);
          if (f.isbn) parts.push("ISBN: " + f.isbn);
          if (parts.length) extra += '<div class="rh-detail">' + esc(parts.join(" · ")) + "</div>";
        }
        if (h.query) extra += '<div class="rh-url">query: ' + esc(h.query) + "</div>";
        if (h.url) extra += '<div class="rh-url"><a href="' + esc(h.url) + '" target="_blank" rel="noopener">' + esc(h.url) + "</a></div>";
        if (h.detail && h.result !== "retrieved") extra += '<div class="rh-detail">' + esc(h.detail) + "</div>";
        return '<li><span class="rh-n">' + (i + 1) + '.</span> <span class="rh-via">' + esc(h.via || "—") + "</span> " +
          badge(String(h.result || "").replace(/_/g, " "), kind) + extra + "</li>";
      })
      .join("");
    return '<h2>' + esc(title) + '</h2><ol class="rh-list">' + rows + "</ol>";
  }

  function showSourceDocument(key) {
    setNav("sources");
    setHash("#source/" + encodeURIComponent(key));
    document.title = "Source document — Chronology Browser";
    withSourceDocs(function (recs) {
      var rec = recs.filter(function (r) { return r.key === key; })[0];
      if (!rec) {
        contentEl.innerHTML =
          '<div class="sources"><div class="sub"><a href="#" class="status-link" id="back-ds">&larr; document sources</a></div>' +
          '<div class="empty">No source document with that identity.</div></div>';
        var b0 = document.getElementById("back-ds");
        if (b0) b0.onclick = function (e) { e.preventDefault(); showDocumentSources(); };
        return;
      }
      var s = rec.source || {};
      var order = ["author", "title", "container_work", "publisher_or_journal", "year", "pages",
        "identifier", "document_type", "retrieval_url", "wikipedia_access_date",
        "retrieval_status", "retrieval_note", "retrieved_via_wayback", "is_public_domain", "local_cache_path"];
      var kvRows = order
        .filter(function (k) { return k in s; })
        .map(function (k) {
          var v = s[k];
          var cell;
          if (k === "local_cache_path" && v) {
            var rel = String(v).replace(/^\/+/, "");
            cell = '<a href="' + esc(rel) + '" target="_blank" rel="noopener">' + esc(v) + "</a>";
          } else if (k === "retrieval_url" && v) {
            cell = '<a href="' + esc(v) + '" target="_blank" rel="noopener">' + esc(v) + "</a>";
          } else if (Array.isArray(v)) {
            cell = esc(v.join(", "));
          } else if (v === null || v === "" || v === undefined) {
            cell = '<span class="muted">—</span>';
          } else {
            cell = esc(String(v));
          }
          return "<tr><th>" + esc(k.replace(/_/g, " ")) + "</th><td>" + cell + "</td></tr>";
        })
        .join("");

      var citedBy = rec.refs
        .map(function (r) {
          return '<a href="#" class="src-ref" data-doc="' + esc(r.doc_id) + '" data-claim="' + esc(r.claim_id) + '">' +
            esc(r.doc_title) + " · " + esc(r.claim_id) + "</a>";
        })
        .join("");

      contentEl.innerHTML =
        '<div class="sources">' +
        '<div class="sub"><a href="#" class="status-link" id="back-ds">&larr; document sources</a></div>' +
        "<h1>" + esc(s.title || "(untitled source document)") + "</h1>" +
        '<div class="src-status-row">' +
        badge(String(rec.status).replace(/_/g, " "), rec.status === "retrieved" ? "ok" : rec.status === "unreachable" ? "bad" : "neutral") +
        (rec.origin ? " " + badge("document source: " + rec.origin, "neutral") : " " + badge("not retrieved", "neutral")) +
        "</div>" +
        '<table class="kv2">' + kvRows + "</table>" +
        histBlock("Metadata lookups", s.metadata_history, true) +
        histBlock("Retrieval history", s.retrieval_history, false) +
        "<h2>Cited by</h2>" +
        '<div class="sub">the citation(s) in Wikipedia articles that point to this source document</div>' +
        '<div class="src-refs">' + citedBy + "</div>" +
        "<h2>Cites</h2>" +
        '<div class="sub">source documents this one cites, via its own citations — populated by phase 3 (following citations inside a source), which is not implemented yet</div>' +
        "</div>";
      wireSourceRefs();
      var b = document.getElementById("back-ds");
      if (b) b.onclick = function (e) { e.preventDefault(); showDocumentSources(); };
    });
  }

  /* ---- home: analyze a new Wikipedia article into the database -------- */

  function slugify(s) {
    return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  function stopAnalyzePoll() {
    if (analyzePoll) { clearInterval(analyzePoll); analyzePoll = null; }
  }

  function setHomeStatus(cls, text) {
    var el = document.getElementById("home-status");
    if (el) {
      el.className = "home-status " + (cls || "");
      el.textContent = text;
    }
  }

  function pollAnalyze(jobKey) {
    fetchJSON("/api/analyze/status?job=" + encodeURIComponent(jobKey))
      .then(function (job) {
        if (job.running) {
          setHomeStatus("", (job.log || []).slice(-1)[0] || "Analyzing…");
          return;
        }
        stopAnalyzePoll();
        var btn = document.getElementById("home-go");
        if (btn) btn.disabled = false;
        if (job.ok) {
          setHomeStatus("home-ok", "Analysis complete — opening the report…");
          var slug = jobKey.replace(/^new:/, "");
          fetchJSON("/api/files").then(function (data) {
            files = data;
            renderList();
            var meta = files.filter(function (f) {
              var id = String(f.id).replace(/\.json$/i, "");
              return id === slug || slugify(f.title) === slug;
            })[0];
            if (meta) load(meta);
          });
        } else {
          var last = (job.log || []).slice(-1)[0];
          setHomeStatus("home-fail", "Analysis failed" + (last ? " — " + last : ""));
        }
      })
      .catch(function () { /* transient — retry next tick */ });
  }

  function runAnalyze(wikiUrl) {
    homeState.url = wikiUrl;
    var btn = document.getElementById("home-go");
    if (btn) btn.disabled = true;
    setHomeStatus("", "Starting analysis…");
    fetch("/api/analyze?url=" + encodeURIComponent(wikiUrl), { method: "POST" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.error) {
          if (btn) btn.disabled = false;
          setHomeStatus("home-fail", d.error);
          return;
        }
        setHomeStatus("", "Analyzing " + wikiUrl + " — this can take a few minutes…");
        stopAnalyzePoll();
        pollAnalyze(d.job);
        analyzePoll = setInterval(function () { pollAnalyze(d.job); }, 2500);
      })
      .catch(function (e) {
        if (btn) btn.disabled = false;
        setHomeStatus("home-fail", e.message);
      });
  }

  function showHome() {
    setNav("home");
    clearHash();
    document.title = "Home — Chronology Browser";
    contentEl.innerHTML =
      '<div class="home">' +
      "<h1>Add an article</h1>" +
      '<div class="sub">Paste a Wikipedia URL. It is run through the full extraction pipeline and added to the database.</div>' +
      '<form id="home-form">' +
      '<input id="home-url" type="url" placeholder="https://en.wikipedia.org/wiki/Stonehenge" value="' + esc(homeState.url) + '">' +
      '<button id="home-go" type="submit">Analyze &amp; add</button>' +
      "</form>" +
      '<div id="home-status" class="home-status"></div>' +
      "</div>";
    var form = document.getElementById("home-form");
    form.onsubmit = function (e) {
      e.preventDefault();
      var v = document.getElementById("home-url").value.trim();
      if (v) runAnalyze(v);
    };
  }

  /* ---- claim finder ---------------------------------------------------- */

  function markerLine(m) {
    var srcTxt = "";
    if (m.note_only) srcTxt = ' <span class="src">— explanatory note</span>';
    else if (m.source) {
      var bits = [m.source.author, m.source.year, m.source.type].filter(Boolean).join(" · ");
      srcTxt = ' <span class="src">— ' + esc(bits) + (m.source.sparse ? " (sparse)" : "") + "</span>";
    } else srcTxt = ' <span class="src">— no source resolved</span>';
    var fn = m.footnote ? esc(m.footnote.slice(0, 160)) : "<i>no footnote text</i>";
    return '<div class="m"><span class="lab">[' + esc(m.label) + "]</span>" + fn + srcTxt + "</div>";
  }

  function claimCard(c) {
    // highlight the word(s) that made this sentence a date candidate (step 1).
    // Collect match ranges on the plain (tag-free) escaped string, merge any
    // overlaps, then splice <mark> in from right to left so nothing nests.
    var plain = esc(c.sentence_cited);
    var trigs = (c.triggers || []).slice().sort(function (a, b) { return b.length - a.length; });
    var ranges = [];
    trigs.forEach(function (t) {
      if (!t) return;
      var re = new RegExp(esc(t).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
      var m;
      while ((m = re.exec(plain))) {
        ranges.push([m.index, m.index + m[0].length]);
        if (m.index === re.lastIndex) re.lastIndex++;
      }
    });
    ranges.sort(function (a, b) { return a[0] - b[0]; });
    var merged = [];
    ranges.forEach(function (r) {
      var last = merged[merged.length - 1];
      if (last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]);
      else merged.push(r.slice());
    });
    var hit = plain;
    for (var i = merged.length - 1; i >= 0; i--) {
      hit = hit.slice(0, merged[i][0]) + '<mark class="trg">' +
        hit.slice(merged[i][0], merged[i][1]) + "</mark>" + hit.slice(merged[i][1]);
    }
    hit = hit.replace(/\[([0-9a-z]{1,3})\]/g, "<sup>[$1]</sup>");
    var before = (c.context_before || []).join(" ");
    var after = (c.context_after || []).join(" ");
    var sent =
      (before ? '<span class="ctx">' + esc(before) + "</span> " : "") +
      '<span class="hit">' + hit + "</span>" +
      (after ? ' <span class="ctx">' + esc(after) + "</span>" : "");
    var marks = c.markers.length
      ? '<div class="fr-marks">' + c.markers.map(markerLine).join("") + "</div>"
      : "";
    return (
      '<li' + (c.rejected || c.reason ? ' class="rejected"' : "") + ">" +
      '<div class="fr-sec">§ ' + esc(c.section) +
      (c.reason ? ' <span class="fr-drop">rejected — ' + esc(c.reason) + "</span>" : "") +
      "</div>" +
      '<div class="fr-sent">' + sent + "</div>" +
      '<div class="fr-cut">cutoff: ' + esc(c.cutoff.basis) +
      (c.cutoff.ambiguous ? " · <b>ambiguous</b>" : "") +
      (c.cutoff.note ? " · " + esc(c.cutoff.note) : "") + "</div>" +
      marks + "</li>"
    );
  }

  function renderFinder(d) {
    if (d.error) return '<div class="fr-err">' + esc(d.error) + "</div>";
    var c = d.counts || { kept: 0, rejected: 0 };
    var cands = d.candidates || [];
    return (
      '<div class="fr-head">' + esc(d.page.title) + " · rev " + esc(d.page.revid) + " · " + d.page.sections + " sections</div>" +
      '<div class="fr-counts"><b>' + c.kept + "</b> claims kept · <b>" + c.rejected + "</b> rejected · in document order</div>" +
      (cands.length ? '<ol class="fr-claims">' + cands.map(claimCard).join("") + "</ol>" : '<div class="empty">No dated claim candidates found.</div>')
    );
  }

  /* ---- claim finder URL sync (so a plain F5 re-runs it) -------------- */

  function parseWikiInput(u) {
    var m = String(u || "").match(
      /^https?:\/\/([a-z-]{2,12})\.(?:m\.)?wikipedia\.org\/wiki\/([^?#]+)/i
    );
    if (!m) return null;
    var slug = m[2];
    try { slug = decodeURIComponent(slug); } catch (e) {}
    return { lang: m[1].toLowerCase(), slug: slug.replace(/_/g, " ") };
  }
  function wikiUrl(lang, slug) {
    return "https://" + lang + ".wikipedia.org/wiki/" +
      encodeURIComponent(slug.replace(/ /g, "_")).replace(/%2F/gi, "/").replace(/%3A/gi, ":");
  }
  // "https://en.wikipedia.org/wiki/Stonehenge" -> "#finder/Stonehenge"
  // non-English wikis keep a "lang:" prefix ("#finder/de:Stonehenge")
  function finderHash(u) {
    var p = parseWikiInput(u);
    if (!p) return "#finder";
    return "#finder/" + (p.lang === "en" ? "" : p.lang + ":") + p.slug.replace(/ /g, "_");
  }
  function urlFromHash(h) {
    var m = String(h || "").match(/^#finder\/(.+)$/);
    if (!m) return "";
    var rest = m[1];
    try { rest = decodeURIComponent(rest); } catch (e) {}
    var lm = rest.match(/^([a-z]{2,3}):(.+)$/);
    return wikiUrl(lm ? lm[1] : "en", (lm ? lm[2] : rest).replace(/_/g, " "));
  }
  function setHash(h) {
    if (location.hash === h) return;
    suppressHash = true;
    location.hash = h;
  }
  function clearHash() {
    if (!location.hash) return;
    try {
      history.replaceState(null, "", location.pathname + location.search);
    } catch (e) {
      suppressHash = true;
      location.hash = "";
    }
  }
  function routeFromHash() {
    var h = location.hash;
    if (/^#finder(\/|$)/.test(h)) {
      showFinder();
      var u = urlFromHash(h);
      if (u) {
        var inp = document.getElementById("finder-url");
        if (inp) inp.value = u;
        if (finderState.url !== u || !finderState.html) runFinder(u);
      }
      return true;
    }
    var cm = h.match(/^#claims\/(.+)$/);
    if (cm) {
      showClaimList(decodeURIComponent(cm[1]));
      return true;
    }
    if (h === "#sources") { showDocumentSources(); return true; }
    var dsm = h.match(/^#docsource\/(.+)$/);
    if (dsm) { showDocumentSources(decodeURIComponent(dsm[1])); return true; }
    if (h === "#stats") { showStats(); return true; }
    if (h === "#unreachable") { showUnreachable(); return true; }
    if (h === "#radiocarbon") { showRadiocarbon(); return true; }
    var sm = h.match(/^#source\/(.+)$/);
    if (sm) {
      showSourceDocument(decodeURIComponent(sm[1]));
      return true;
    }
    var clm = h.match(/^#claim\/([^/]+)\/(.+)$/);
    if (clm) {
      showClaim(decodeURIComponent(clm[1]), decodeURIComponent(clm[2]));
      return true;
    }
    var dm = h.match(/^#doc\/(.+)$/);
    if (dm) {
      var id = decodeURIComponent(dm[1]);
      var meta = files.filter(function (f) { return f.id === id; })[0];
      if (meta) {
        load(meta);
        return true;
      }
    }
    return false;
  }

  function runFinder(url) {
    finderState.url = url;
    setHash(finderHash(url));
    var out = document.getElementById("finder-out");
    if (out) out.innerHTML = '<div class="empty">Extracting claims from ' + esc(url) + " …</div>";
    fetchJSON("/api/find-claims?url=" + encodeURIComponent(url))
      .then(function (d) {
        finderState.html = renderFinder(d);
        var o = document.getElementById("finder-out");
        if (o) o.innerHTML = finderState.html;
      })
      .catch(function (e) {
        var o = document.getElementById("finder-out");
        if (o) o.innerHTML = '<div class="fr-err">' + esc(e.message) + "</div>";
      });
    try { localStorage.setItem("finder-url", url); } catch (e) {}
  }

  function showFinder() {
    setNav("finder");
    if (!/^#finder(\/|$)/.test(location.hash)) setHash("#finder");
    document.title = "Claim finder — Chronology Browser";
    var last = finderState.url;
    try { last = last || localStorage.getItem("finder-url") || ""; } catch (e) {}
    contentEl.innerHTML =
      '<div class="finder"><h1>Claim finder</h1>' +
      '<div class="sub">Runs the analysis extractor (<code>lib/wiki.js</code>) on any Wikipedia URL — no source downloads, no AI. For tuning how claims are detected.</div>' +
      '<form id="finder-form"><input id="finder-url" type="url" placeholder="https://en.wikipedia.org/wiki/Ancient_Egypt" value="' + esc(last) + '">' +
      "<button type=\"submit\">Find claims</button></form>" +
      '<div id="finder-out">' + (finderState.html || "") + "</div></div>";
    var form = document.getElementById("finder-form");
    form.onsubmit = function (e) {
      e.preventDefault();
      var v = document.getElementById("finder-url").value.trim();
      if (v) runFinder(v);
    };
  }

  function draw() {
    if (!current) return;
    btnRendered.classList.toggle("on", view === "rendered");
    btnRaw.classList.toggle("on", view === "raw");
    if (view === "raw") {
      var pre = document.createElement("pre");
      pre.className = "raw";
      pre.textContent = JSON.stringify(current.data, null, 2);
      contentEl.innerHTML = "";
      contentEl.appendChild(pre);
    } else {
      var frame = document.createElement("iframe");
      frame.id = "frame";
      contentEl.innerHTML = "";
      contentEl.appendChild(frame);
      if (pendingScrollTo) {
        // not cleared here: draw() re-runs once more when loadContext()
        // resolves shortly after, replacing this iframe — the target must
        // survive that second draw() too. Cleared only by the next load().
        var claimId = pendingScrollTo;
        frame.addEventListener("load", function () {
          try {
            var el = frame.contentDocument.getElementById(claimId);
            if (el) el.scrollIntoView({ block: "start" });
          } catch (e) {}
        });
      }
      frame.srcdoc = ChronoRender.renderDocument(current.data, {
        context: current.context || {},
        docId: current.meta.id,
      });
    }
  }
  var pendingScrollTo = null; // claim_id to scroll to on the next iframe load

  // grey "sentence before/after" context (see lib/context.js) loads after the
  // first paint and triggers one redraw — it's a nice-to-have, never blocking.
  function loadContext(id) {
    fetchJSON("/api/context?id=" + encodeURIComponent(id))
      .then(function (ctx) {
        if (current && current.meta.id === id) {
          current.context = ctx;
          if (view === "rendered") draw();
        }
      })
      .catch(function () {});
  }

  function load(meta, scrollToClaimId) {
    stopReanalyzePoll();
    hideReanalyzeBar();
    fetchJSON("/api/file?id=" + encodeURIComponent(meta.id))
      .then(function (data) {
        screen = "doc";
        contentEl.className = "content";
        setHash("#doc/" + encodeURIComponent(meta.id));
        [btnHome, btnStats, btnFinder, btnSources, btnUnreachable, btnRadiocarbon].forEach(function (b) {
          b.classList.remove("active");
        });
        toolbarEl.hidden = false;
        current = { meta: meta, data: data, context: {} };
        renderList();
        pendingScrollTo = scrollToClaimId || null;
        draw();
        loadContext(meta.id);
        document.title = meta.title + " — Chronology Browser";
        // pick back up a re-analysis that was already running (e.g. across an F5)
        fetchJSON("/api/reanalyze/status?id=" + encodeURIComponent(meta.id))
          .then(function (job) {
            if (job && job.running) {
              btnReanalyze.disabled = true;
              showReanalyzeBar("", (job.log || []).slice(-1)[0] || "Re-analyzing…");
              startReanalyzePoll(meta.id);
            }
          })
          .catch(function () {});
      })
      .catch(function (e) {
        contentEl.innerHTML = '<div class="empty">Failed to load: ' + esc(e.message) + "</div>";
      });
  }

  btnHome.onclick = showHome;
  btnStats.onclick = showStats;
  btnFinder.onclick = showFinder;
  btnSources.onclick = showDocumentSources;
  btnUnreachable.onclick = showUnreachable;
  btnRadiocarbon.onclick = showRadiocarbon;
  btnRendered.onclick = function () { view = "rendered"; draw(); };
  btnRaw.onclick = function () { view = "raw"; draw(); };
  searchEl.oninput = renderList;

  function inlineImages(html) {
    // fold /source-cache/... image URLs (quote crop <img src>, full-page <a href>)
    // into data: URIs so the saved file is portable
    var srcs = [];
    html.replace(/(?:src|href)="(\/source-cache\/[^"']+\.(?:png|jpe?g|webp|gif))"/gi, function (m, s) {
      if (srcs.indexOf(s) === -1) srcs.push(s);
      return m;
    });
    if (!srcs.length) return Promise.resolve(html);
    return Promise.all(
      srcs.map(function (s) {
        return fetch(s)
          .then(function (r) { return r.ok ? r.blob() : null; })
          .then(function (b) {
            if (!b) return null;
            return new Promise(function (res) {
              var fr = new FileReader();
              fr.onload = function () { res({ s: s, d: fr.result }); };
              fr.onerror = function () { res(null); };
              fr.readAsDataURL(b);
            });
          })
          .catch(function () { return null; });
      })
    ).then(function (pairs) {
      pairs.forEach(function (p) {
        if (p) html = html.split('"' + p.s + '"').join('"' + p.d + '"');
      });
      return html;
    });
  }

  btnDownload.onclick = function () {
    if (!current) return;
    inlineImages(ChronoRender.renderDocument(current.data)).then(function (html) {
      var url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
      dl.href = url;
      dl.download = (current.meta.name.replace(/\.json$/i, "") || "document") + ".html";
      dl.click();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    });
  };

  /* ---- re-analyze: rerun the full pipeline for the open document ------ */

  function showReanalyzeBar(cls, text) {
    reanalyzeBar.className = ("show " + (cls || "")).trim();
    raText.textContent = text;
  }
  function hideReanalyzeBar() {
    reanalyzeBar.className = "";
  }
  function stopReanalyzePoll() {
    if (reanalyzePoll) { clearInterval(reanalyzePoll); reanalyzePoll = null; }
  }
  function pollReanalyze(id) {
    fetchJSON("/api/reanalyze/status?id=" + encodeURIComponent(id))
      .then(function (job) {
        if (job.running) {
          showReanalyzeBar("", (job.log || []).slice(-1)[0] || "Re-analyzing…");
          return;
        }
        stopReanalyzePoll();
        if (current && current.meta.id === id) btnReanalyze.disabled = false;
        if (job.ok) {
          showReanalyzeBar("ra-ok", "Re-analysis complete — reloading…");
          fetchJSON("/api/files").then(function (data) {
            files = data;
            renderList();
            var meta = files.filter(function (f) { return f.id === id; })[0];
            if (meta && current && current.meta.id === id) {
              fetchJSON("/api/file?id=" + encodeURIComponent(id)).then(function (data2) {
                current = { meta: meta, data: data2, context: {} };
                draw();
                loadContext(id);
                showReanalyzeBar("ra-ok", "Re-analysis complete.");
                setTimeout(hideReanalyzeBar, 5000);
              });
            }
          });
        } else {
          var last = (job.log || []).slice(-1)[0];
          showReanalyzeBar("ra-fail", "Re-analysis failed" + (last ? " — " + last : ""));
        }
      })
      .catch(function () { /* transient network hiccup — next tick will retry */ });
  }
  function startReanalyzePoll(id) {
    stopReanalyzePoll();
    pollReanalyze(id);
    reanalyzePoll = setInterval(function () { pollReanalyze(id); }, 2000);
  }

  btnReanalyze.onclick = function () {
    if (!current) return;
    var id = current.meta.id;
    btnReanalyze.disabled = true;
    showReanalyzeBar("", "Starting re-analysis…");
    fetch("/api/reanalyze?id=" + encodeURIComponent(id), { method: "POST" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.error) {
          btnReanalyze.disabled = false;
          showReanalyzeBar("ra-fail", d.error);
          return;
        }
        showReanalyzeBar("", "Re-analyzing (" + (d.mode || "default") + " mode) — this can take a few minutes…");
        startReanalyzePoll(id);
      })
      .catch(function (e) {
        btnReanalyze.disabled = false;
        showReanalyzeBar("ra-fail", e.message);
      });
  };

  window.addEventListener("hashchange", function () {
    if (suppressHash) { suppressHash = false; return; }
    if (routeFromHash()) return;
    showHome();
  });

  fetchJSON("/api/files")
    .then(function (data) {
      files = data;
      renderList();
      if (routeFromHash()) return;
      showHome();
    })
    .catch(function (e) {
      listEl.innerHTML = '<li class="meta">Could not list files: ' + esc(e.message) + "</li>";
      showHome();
    });
})();
</script>
</body>
</html>
